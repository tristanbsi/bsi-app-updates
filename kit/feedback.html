<!doctype html>
<html lang="en" class="bsi"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Send Feedback</title>
<link rel="stylesheet" href="bsi-tokens.css">
<link rel="stylesheet" href="bsi-base.css">
<style>
  /* The shared feedback window: the BSI design system (bsi-tokens.css + bsi-base.css, synced from the kit). The app's
     identity hue comes from data-app on <html>; nothing else differs between apps. */
  html, body { margin: 0; height: 100%; }
  body { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: var(--bsi-space-3); -webkit-user-select: none; }
  h1 { font-size: var(--bsi-t-heading); margin: 0; }
  textarea.bsi-field { flex: 1; resize: none; -webkit-user-select: text; }
  #status { flex: 1; font-size: var(--bsi-t-meta); min-height: 16px; }
  #status.err { color: var(--bsi-danger); } #status.ok { color: var(--bsi-ok); } #status.busy { color: var(--bsi-fg-muted); }
</style></head>
<body>
  <h1>Send feedback about <span id="appName">this app</span></h1>
  <textarea id="msg" class="bsi-field" maxlength="4000" placeholder="What's working, what isn't, what you'd like" autofocus></textarea>
  <p class="bsi-help" style="margin:0">Your name and the screen you were on go with it.</p>
  <div class="bsi-actions">
    <div id="status" role="status" aria-live="polite"></div>
    <button id="cancel" class="bsi-btn bsi-btn-quiet">Cancel</button>
    <button id="send" class="bsi-btn bsi-btn-primary">Send</button>
  </div>
<script>
  const F = window.feedback, $ = id => document.getElementById(id);
  if (F.appName) $('appName').textContent = F.appName;
  // identity: data-app picks the app's hue from bsi-tokens.css; an app may still hand in its own colours (older callers)
  if (F.appId) document.documentElement.dataset.app = F.appId;
  const applyPalette = () => {
    const p = (F.palette && (matchMedia('(prefers-color-scheme: dark)').matches ? F.palette.dark : F.palette.light)) || {};
    const map = { bg: '--bsi-bg-base', panel: '--bsi-bg-raised', ink: '--bsi-fg', muted: '--bsi-fg-muted', line: '--bsi-border-strong', accent: '--bsi-accent', accentInk: '--bsi-on-accent', danger: '--bsi-danger', ok: '--bsi-ok' };
    for (const k in map) if (p[k]) document.documentElement.style.setProperty(map[k], String(p[k]));
  };
  applyPalette(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyPalette);
  const status = (t, cls) => { $('status').textContent = t; $('status').className = cls || ''; };
  let sending = false;
  async function go() {
    if (sending) return;
    const text = $('msg').value.trim();
    if (!text) { status('Write the feedback first.', 'err'); $('msg').focus(); return; }
    sending = true; $('send').disabled = true; $('msg').readOnly = true; status('Sending…', 'busy');
    let r; try { r = await F.send(text, F.context); } catch (e) { r = { ok: false, error: 'Not sent. Your text is still here.' }; }
    sending = false; $('msg').readOnly = false;
    if (r && r.ok) { status('Sent. Thanks!', 'ok'); $('msg').value = ''; setTimeout(() => F.close(), 1200); }
    else { $('send').disabled = false; status((r && r.error) || 'Not sent.', 'err'); $('msg').focus(); }
  }
  $('send').onclick = go;
  $('cancel').onclick = () => F.close();
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !sending) F.close();
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(); }
  });
</script>
</body></html>
